name: Publier le site MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer MkDocs et le thème Pyodide
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs pyodide-mkdocs-theme

      - name: Compiler et déployer
        run: mkdocs gh-deploy --force
